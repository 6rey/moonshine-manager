version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vdi_postgres
    restart: always
    environment:
      POSTGRES_USER: vdi_user
      POSTGRES_PASSWORD: vdi_password
      POSTGRES_DB: vdi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
